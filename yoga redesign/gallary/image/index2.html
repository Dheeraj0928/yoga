<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yoga Section</title>
    <style>
        /* Main section styling */
        .elementor-section {
            position: relative;
            background-color: #f7de9b; /* Light yellow background */
            padding: 34px; /* Uniform padding for all sides */
            text-align: center;
        }

        /* SVG shape divider for the top curve */
        .elementor-shape {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 100px;
            overflow: hidden;
            line-height: 0;
            width: 100%;
        }

        .elementor-shape svg {
            display: block;
            width: 100%;
            height: 100%;
        }

        .elementor-shape-fill {
            fill: white;
        }

        
        .elementor-container {
            position: relative;
            z-index: 2;
            max-width: 800px;
            margin: 0 auto;
        }

        
        .elementor-heading-title {
            color: #202020; 
            font-family: Arial, sans-serif;
            font-size: 2em;
            font-weight: bold;
            margin: 0;
        }

    </style>
</head>
<body>

    <section class="elementor-section elementor-top-section elementor-element elementor-element-42cd784 elementor-section-boxed elementor-section-height-default elementor-section-height-default" data-id="42cd784" data-element_type="section" data-settings="{&quot;background_background&quot;:&quot;classic&quot;,&quot;shape_divider_top&quot;:&quot;curve-asymmetrical&quot;}">
        <div class="elementor-shape elementor-shape-top" data-negative="false">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 100" preserveAspectRatio="none">
                <path class="elementor-shape-fill" d="M0,0c0,0,0,6,0,6.7c0,18,240.2,93.6,615.2,92.6C989.8,98.5,1000,25,1000,6.7c0-0.7,0-6.7,0-6.7H0z"></path>
            </svg>
        </div>

        
        <div class="elementor-container elementor-column-gap-default">
            <div class="elementor-column elementor-col-100 elementor-top-column elementor-element elementor-element-ec04b4c" data-id="ec04b4c" data-element_type="column">
                <div class="elementor-widget-wrap elementor-element-populated">
                    <div class="elementor-element elementor-element-5e1edde elementor-widget elementor-widget-heading" data-id="5e1edde" data-element_type="widget" data-widget_type="heading.default">
                        <div class="elementor-widget-container">
                            <h2 class="elementor-heading-title elementor-size-default">The Elegance of Yoga: Moments Preserved.</h2>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

</body>
</html>
